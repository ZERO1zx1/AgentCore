name: AgentCore Tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall src plugin feat examples/backend
      - name: Core tests
        run: python -m pytest tests/ -v
      - name: Low-cost skill tests
        run: python -m pytest feat/low_cost_skill/tests -v
      - name: Backend example tests
        run: python -m pytest tests/test_usage_proxy.py -v
      - name: Plugin tests (ResourceWarning is an error)
        run: python -W error::ResourceWarning -m pytest plugin/ -v
      - name: Adaptive-local-memory tests
        run: python -m unittest skills/adaptive-local-memory/scripts/test_memory.py -v
      - name: Repository ignore policy
        shell: bash
        run: |
          # Probe child paths because these ignored directories do not exist in
          # the Python-only job. --no-index also checks rules for tracked files.
          git check-ignore --no-index -q credit_demo.db
          git check-ignore --no-index -q examples/frontend/node_modules/.ignore-probe
          git check-ignore --no-index -q examples/frontend/dist/.ignore-probe
          git check-ignore --no-index -q examples/backend/express/node_modules/.ignore-probe
          for lockfile in \
            examples/frontend/package-lock.json \
            examples/backend/express/package-lock.json; do
            if git check-ignore --no-index -q "$lockfile"; then
              echo "$lockfile must remain trackable"
              exit 1
            fi
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20.17"
      - name: Install dependencies (locked)
        run: npm ci
      - name: Jest tests
        run: npm test -- --runInBand
      - name: Production build
        run: npm run build

  express-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/backend/express
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20.17"
          cache: npm
          cache-dependency-path: examples/backend/express/package-lock.json
      - name: Install dependencies (locked)
        run: npm ci
      - name: Express SQLite tests
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high
